# Source of truth for /ai-stack:bootstrap — what gets checked and installed.
#
# required: true  → prerequisite; skill fails fast if missing (no install command)
# required: false → managed tool; skill installs it if absent
#
# lsp_plugins: sequence of <name>@<source> — installed as Claude plugins
# plugins/skills/mcps: paths to registry files processed by bootstrap steps 4-6

# Polyglot version manager — installed first in Step 2, then used to pin global language versions.
# global_runtimes: run after mise is installed (or confirmed present).
version_manager:
  name: mise
  check: "command -v mise"
  required: false
  install: "brew install mise"
  global_runtimes: "mise use --global python@3.12 node@20 go@1.24"

languages:
  go:
    runtime:
      name: go
      check: go version
      required: true
      reason: "Install via mise (run /ai-stack:bootstrap) or from https://go.dev/dl/"

  python:
    runtime:
      name: uv
      check: uv --version
      required: false
      install: "curl -LsSf https://astral.sh/uv/install.sh | sh"

  typescript:
    runtime:
      name: node
      check: node --version
      required: true
      reason: "Install via mise (run /ai-stack:bootstrap) or from https://nodejs.org/"
    package_manager:
      name: pnpm
      check: pnpm --version
      required: false
      install: "npm install -g pnpm"

  rust:
    runtime:
      name: rustup
      check: rustup --version
      required: false
      install: "curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y"

# LSP servers installed as official Claude plugins.
# Format: <plugin-name>@<source>  (same name/source as in plugins.yaml)
lsp_plugins:
  - gopls-lsp@claude-plugins-official
  - pyright-lsp@claude-plugins-official
  - typescript-lsp@claude-plugins-official
  - rust-analyzer-lsp@claude-plugins-official

# Registry files processed by bootstrap (plugins, skills, MCP servers)
plugins: .claude/skills/ai-stack/reference/plugins.yaml
skills:  .claude/skills/ai-stack/reference/skills.yaml
mcps:    .claude/skills/ai-stack/reference/mcps.yaml
