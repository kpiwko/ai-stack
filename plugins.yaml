# Claude Code plugins and bare skills
#
# plugins   — installed via Claude Code slash command (/plugin install)
#             `just install-plugins` prints the commands to run
#
# skills    — bare skills not packaged as plugins, installed directly to
#             .claude/skills/ (project) or ~/.claude/skills/ (global)
#             `just install-skills` fetches and installs them automatically
#             requires: yq (brew install yq), git

plugins: []

# Example plugin entry:
# - name: jira
#   source: openshift-eng/ai-helpers   # GitHub owner/repo
#   version: "v1.2.0"                  # pin to a release tag

skills:
  - name: red-hat-quick-deck
    source: toddward/red-hat-quick-deck
    version: main
    scope: global

  - name: template-slide-deck
    source: toddward/claude-skills-playground
    path: template-slide-deck
    version: main
    scope: global

  - name: n8n-skills
    source: czlonkowski/n8n-skills
    version: main
    scope: global
    optional: true

# Example skill entry:
# - name: suggest-reviewers
#   source: openshift-eng/ai-helpers   # GitHub owner/repo
#   path: plugins/git/skills/suggest-reviewers  # path inside repo (omit for repo root)
#   version: "v1.2.0"                  # tag, branch, or commit
#   scope: project                     # project (.claude/skills/) or global (~/.claude/skills/)
