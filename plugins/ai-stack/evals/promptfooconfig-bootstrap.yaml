description: /ai-stack:bootstrap skill evals

# NOTE: bootstrap evals run against real machine state (they register MCPs,
# install runtimes). These are integration tests, not unit tests. Run manually
# on a clean dev machine or CI. Gate CI on up/down/project-init only.
#
# concurrency:1 is required — parallel runs collide on claude plugin list / mcp list.
concurrency: 1

prompts:
  - '{{scenario}}'

providers:
  - 'exec: python3 ../../../tools/run-skill.py bootstrap'

defaultTest:
  options:
    provider:
      text:
        id: vertex:claude-haiku-4-5-20251001
        config:
          projectId: "{{env.ANTHROPIC_VERTEX_PROJECT_ID}}"
          region: global
          anthropic_version: "vertex-2023-10-16"
          max_tokens: 1024
  assert:
    - type: javascript
      value: |
        try { JSON.parse(output); return true; }
        catch(e) { return { pass: false, score: 0, reason: 'runner did not emit valid JSON' }; }

tests:
  - description: "Prerequisites pass: bootstrap completed successfully"
    vars:
      scenario: default
    assert:
      - type: llm-rubric
        value: |
          The output must indicate that the bootstrap process completed
          successfully. It should either show a summary table of installed
          components OR state that everything is already set up. It must NOT
          indicate that prerequisites are missing or that the process aborted.
        threshold: 0.7
      - type: javascript
        value: |
          const r = JSON.parse(output);
          if (/go.*MISSING|node.*MISSING/.test(r.output)) return { pass: false, score: 0, reason: 'prerequisite check failed' };
          return { pass: true, score: 1, reason: 'ok' };

  - description: "mise runtime: mentioned in bootstrap output"
    vars:
      scenario: default
    assert:
      - type: llm-rubric
        value: |
          The output must mention mise (the polyglot version manager) in some
          capacity — either as installed, already installed, or used to set
          global runtimes. A terse summary saying everything is set up also
          counts as a pass since mise is included in "everything".
        threshold: 0.7

  - description: "Already-installed items: acknowledged in summary"
    vars:
      scenario: default
    assert:
      - type: llm-rubric
        value: |
          The output must acknowledge that some or all components were already
          installed. This can be an explicit "already installed" status per
          item, OR a terse statement that everything is already set up.
        threshold: 0.7

  - description: "force: managed runtimes reinstalled, not skipped"
    vars:
      scenario: force
    assert:
      - type: llm-rubric
        value: |
          The output must indicate that runtimes and tools were reinstalled or
          re-registered (not skipped as "already installed"). Look for evidence
          of force-reinstall: "installed", "registered", "reinstalled",
          "re-registered", or explicit install commands being run.
        threshold: 0.7

  - description: "Cross-platform: no brew references in bootstrap output"
    vars:
      scenario: default
    assert:
      - type: javascript
        value: |
          const r = JSON.parse(output);
          if (/brew install/i.test(r.output))
            return { pass: false, score: 0, reason: 'bootstrap output references "brew install" — must use cross-platform installer' };
          return { pass: true, score: 1, reason: 'ok' };

  - description: "Unset MCP env var: MCP skipped with reason shown"
    vars:
      scenario: default
    assert:
      - type: javascript
        value: |
          // Only meaningful when DEVLAKE_LOCAL_MCP_SECRET_KEY is unset.
          // If the var is set in the environment, this test is a no-op (returns pass).
          const r = JSON.parse(output);
          if (process.env.DEVLAKE_LOCAL_MCP_SECRET_KEY) return { pass: true, score: 1, reason: 'env var set — skip check' };
          if (!r.output.includes('DEVLAKE_LOCAL_MCP_SECRET_KEY not set'))
            return { pass: false, score: 0, reason: 'MCP skip reason not shown for unset var' };
          return { pass: true, score: 1, reason: 'ok' };
