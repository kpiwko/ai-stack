description: /ai-stack:up skill evals

prompts:
  - '{{scenario}}'

providers:
  - 'exec: python3 ../../../tools/run-skill.py up'

defaultTest:
  assert:
    - type: javascript
      value: |
        try { JSON.parse(output); return true; }
        catch(e) { return { pass: false, score: 0, reason: 'runner did not emit valid JSON: ' + output.slice(0,300) }; }

tests:
  - description: "Fresh directory: compose.yaml and .env created, summary shown"
    vars:
      scenario: fresh
    assert:
      - type: javascript
        value: |
          const r = JSON.parse(output);
          if (!r.state.compose_exists)           return { pass: false, score: 0, reason: 'compose.yaml not created' };
          if (!r.state.env_exists)               return { pass: false, score: 0, reason: '.env not created' };
          if (!r.state.certs_exists)             return { pass: false, score: 0, reason: 'RDS CA cert not present' };
          if (!r.output.includes('ai-stack UP')) return { pass: false, score: 0, reason: 'summary header missing from output' };
          return { pass: true, score: 1, reason: 'ok' };

  - description: "Existing compose.yaml: not overwritten (idempotent)"
    vars:
      scenario: existing-compose
    assert:
      - type: javascript
        value: |
          const r = JSON.parse(output);
          if (!r.state.compose_content.startsWith('# SENTINEL-existing-compose\n')) return { pass: false, score: 0, reason: 'compose.yaml was overwritten (sentinel missing)' };
          if (!r.output.includes('ai-stack UP'))      return { pass: false, score: 0, reason: 'summary missing' };
          return { pass: true, score: 1, reason: 'ok' };

  - description: "Placeholder .env: skill completes, does not abort"
    vars:
      scenario: placeholder-env
    assert:
      - type: javascript
        value: |
          const r = JSON.parse(output);
          if (!r.output.includes('ai-stack UP')) return { pass: false, score: 0, reason: 'skill aborted instead of continuing with placeholder .env' };
          return { pass: true, score: 1, reason: 'ok' };

  - description: "No .env: compose.yaml and .env created, UP summary shown"
    vars:
      scenario: no-env
    assert:
      - type: javascript
        value: |
          const r = JSON.parse(output);
          if (!r.state.env_exists)                   return { pass: false, score: 0, reason: '.env not created from template' };
          if (!r.state.compose_exists)               return { pass: false, score: 0, reason: 'compose.yaml not created' };
          if (!r.output.includes('ai-stack UP'))     return { pass: false, score: 0, reason: 'UP summary missing' };
          return { pass: true, score: 1, reason: 'ok' };
