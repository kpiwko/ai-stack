description: /ai-stack:project-init skill evals

prompts:
  - '{{scenario}}'

providers:
  - 'exec: python3 ../../../tools/run-skill.py project-init'

defaultTest:
  assert:
    - type: javascript
      value: |
        try { JSON.parse(output); return true; }
        catch(e) { return { pass: false, score: 0, reason: 'runner did not emit valid JSON' }; }

tests:
  - description: "Empty directory: CLAUDE.md and AGENTS.md created"
    vars:
      scenario: empty
    assert:
      - type: javascript
        value: |
          const r = JSON.parse(output);
          if (!r.state.claude_md_exists)  return { pass: false, score: 0, reason: 'CLAUDE.md not created' };
          if (!r.state.agents_md_exists)  return { pass: false, score: 0, reason: 'AGENTS.md not created' };
          return { pass: true, score: 1, reason: 'ok' };

  - description: "CLAUDE.md exists without force: skipped, not overwritten"
    vars:
      scenario: existing-md
    assert:
      - type: javascript
        value: |
          const r = JSON.parse(output);
          if (r.state.claude_md_content !== 'existing content')
            return { pass: false, score: 0, reason: 'CLAUDE.md was overwritten despite no force flag' };
          return { pass: true, score: 1, reason: 'ok' };

  - description: "force: existing CLAUDE.md overwritten with template content"
    vars:
      scenario: force
    assert:
      - type: javascript
        value: |
          const r = JSON.parse(output);
          if (r.state.claude_md_content === 'old content')
            return { pass: false, score: 0, reason: 'CLAUDE.md not overwritten despite force' };
          if (!r.state.claude_md_exists) return { pass: false, score: 0, reason: 'CLAUDE.md missing after force' };
          return { pass: true, score: 1, reason: 'ok' };

  - description: "Empty directory: full init flow executed (skills and MCPs processed)"
    vars:
      scenario: empty
    assert:
      - type: javascript
        value: |
          const r = JSON.parse(output);
          // Reaching the MCP step (step 6) proves steps 3-5 (including optional skills) also ran.
          // The model always mentions MCPs even when it omits the summary block or skills details.
          const flowCompleted = /MCP/i.test(r.output);
          if (!flowCompleted) return { pass: false, score: 0, reason: 'no evidence full init flow ran (expected MCP step output)' };
          return { pass: true, score: 1, reason: 'ok' };
