# Skills installed via /ai-stack:bootstrap
#
# Format:
# - name: skill-name
#   source: owner/repo           # GitHub owner/repo
#   path: path/in/repo           # path inside repo (omit for repo root)
#   version: main                # tag, branch, or commit
#   optional: true               # if true, skip during bootstrap; default: false
#   scope: user | project        # user (~/.claude/skills/) or project (.claude/skills/); default: user

skills:
  - name: template-slide-deck
    source: toddward/claude-skills-playground
    path: template-slide-deck
    version: main
    optional: true
    scope: project

  - name: n8n-skills
    source: czlonkowski/n8n-skills
    version: main
    optional: true
    scope: project
