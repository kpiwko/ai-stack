# MCP servers registered via /ai-stack:bootstrap
#
# Format:
# - name: mcp-name
#   transport: http | sse | stdio
#   url: http://localhost:PORT/mcp     # for http/sse
#   command: npx                       # for stdio
#   args: [...]                        # for stdio
#   headers:                           # HTTP headers ($VAR expanded from shell env)
#     Authorization: "Bearer $TOKEN"
#   scope: user | project               # default scope (overridable at install time)

mcps:
  - name: devlake-mysql-local
    transport: http
    url: http://localhost:17300/mcp
    headers:
      Authorization: "Bearer $DEVLAKE_LOCAL_MCP_SECRET_KEY"
    scope: project

  - name: devlake-mysql-staging
    transport: http
    url: http://localhost:17310/mcp
    headers:
      Authorization: "Bearer $DEVLAKE_STAGING_MCP_SECRET_KEY"
    scope: project

  - name: devlake-mysql-prod
    transport: http
    url: http://localhost:17320/mcp
    headers:
      Authorization: "Bearer $DEVLAKE_PROD_MCP_SECRET_KEY"
    scope: project

  - name: notebooklm
    transport: http
    url: http://localhost:17200/mcp
    scope: user

  - name: workspace-mcp
    transport: http
    url: http://localhost:17150/mcp
    scope: user
