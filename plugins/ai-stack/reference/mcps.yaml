# MCP servers registered via /ai-stack:install-mcps
#
# Format:
# - name: mcp-name
#   transport: http | sse | stdio
#   url: http://localhost:PORT/mcp     # for http/sse
#   command: npx                       # for stdio
#   args: [...]                        # for stdio
#   headers:                           # HTTP headers ($VAR expanded from shell env)
#     Authorization: "Bearer $TOKEN"
#   scope: user | project | local      # default scope (overridable at install time)

mcps:
  - name: gmail
    transport: http
    url: http://localhost:17633/mcp
    scope: user

  - name: mcp-atlassian
    transport: http
    url: http://localhost:17000/mcp
    scope: user

  - name: gdrive
    transport: http
    url: http://localhost:17100/mcp
    scope: user

  - name: devlake-prod-mysql-mcp
    transport: http
    url: http://localhost:17300/mcp
    headers:
      Authorization: "Bearer $KONFLUX_MCP_SECRET_KEY"
    scope: local

  - name: devlake-local-mysql-mcp
    transport: http
    url: http://localhost:17301/mcp
    headers:
      Authorization: "Bearer $DEVLAKE_MCP_SECRET_KEY"
    scope: local
