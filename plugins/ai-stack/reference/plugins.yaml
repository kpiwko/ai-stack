# 3rd party plugins installed via /ai-stack:bootstrap
# Built-in ai-stack marketplace plugins (ai-stack, dev, track, quarterly) need no entry here.
#
# Format:
# - name: plugin-name
#   source: marketplace-id   # marketplace identifier used in: claude plugin install <name>@<source>
#                            # for GitHub-hosted marketplaces this is owner/repo
#   version: "v1.2.0"        # tag, branch, or commit (optional)

plugins:
  - name: context7
    source: claude-plugins-official

  - name: superpowers
    source: claude-plugins-official

  - name: gopls-lsp
    source: claude-plugins-official

  - name: pyright-lsp
    source: claude-plugins-official

  - name: typescript-lsp
    source: claude-plugins-official

  - name: rust-analyzer-lsp
    source: claude-plugins-official

  - name: atlassian
    source: claude-plugins-official
