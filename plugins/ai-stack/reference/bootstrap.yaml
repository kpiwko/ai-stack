# Source of truth for /ai-stack:bootstrap — what gets checked and installed.
#
# required: true  → prerequisite; skill fails fast if missing (no install command)
# required: false → managed tool; skill installs it if absent
#
# lsp_plugins: sequence of <name>@<source> — installed as Claude plugins
# plugins/skills/mcps: paths to registry files processed by bootstrap steps 4-6

languages:
  go:
    runtime:
      name: go
      check: go version
      required: true
      reason: "Install from https://go.dev/dl/"

  python:
    runtime:
      name: uv
      check: uv --version
      required: false
      install: "curl -LsSf https://astral.sh/uv/install.sh | sh"

  typescript:
    runtime:
      name: node
      check: node --version
      required: true
      reason: "Install from https://nodejs.org/ or via brew"
    package_manager:
      name: pnpm
      check: pnpm --version
      required: false
      install: "npm install -g pnpm"

  rust:
    runtime:
      name: rustup
      check: rustup --version
      required: false
      install: "curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y"

# LSP servers installed as official Claude plugins.
# Format: <plugin-name>@<source>  (same name/source as in plugins.yaml)
lsp_plugins:
  - gopls-lsp@claude-plugins-official
  - pyright-lsp@claude-plugins-official
  - typescript-lsp@claude-plugins-official
  - rust-analyzer-lsp@claude-plugins-official

# Registry files processed by bootstrap (plugins, skills, MCP servers)
plugins: plugins/ai-stack/reference/plugins.yaml
skills:  plugins/ai-stack/reference/skills.yaml
mcps:    plugins/ai-stack/reference/mcps.yaml
