description: /dev:git-workflow skill evals

prompts:
  - '{{scenario}}'

providers:
  - 'exec: python3 ../../../tools/run-skill.py git-workflow'

defaultTest:
  assert:
    - type: javascript
      value: |
        try { JSON.parse(output); return true; }
        catch(e) { return { pass: false, score: 0, reason: 'runner did not emit valid JSON' }; }

tests:
  - description: "start mode (single remote): creates feature branch"
    vars:
      scenario: start-single
    assert:
      - type: javascript
        value: |
          const r = JSON.parse(output);
          if (!r.state.current_branch || r.state.current_branch === 'main')
            return { pass: false, score: 0, reason: 'still on main — feature branch not created' };
          return { pass: true, score: 1, reason: 'ok' };
      - type: javascript
        value: |
          const r = JSON.parse(output);
          if (!/github/i.test(r.output) && !/github/i.test(JSON.stringify(r.state.remotes)))
            return { pass: false, score: 0, reason: 'github platform not detected' };
          return { pass: true, score: 1, reason: 'ok' };

  - description: "start mode (fork): creates feature branch with upstream present"
    vars:
      scenario: start-fork
    assert:
      - type: javascript
        value: |
          const r = JSON.parse(output);
          if (!r.state.current_branch || r.state.current_branch === 'main')
            return { pass: false, score: 0, reason: 'still on main — feature branch not created' };
          return { pass: true, score: 1, reason: 'ok' };
      - type: javascript
        value: |
          const r = JSON.parse(output);
          if (!/upstream/.test(r.state.remotes || ''))
            return { pass: false, score: 0, reason: 'upstream remote not present in state' };
          return { pass: true, score: 1, reason: 'ok' };

  - description: "pr mode: shows diff and commit log before proceeding"
    vars:
      scenario: pr-single
    assert:
      - type: javascript
        value: |
          const r = JSON.parse(output);
          if (!/diff|changes|stat/i.test(r.output))
            return { pass: false, score: 0, reason: 'diff stat not shown to user' };
          if (!/feat.*test.feature|commit/i.test(r.output))
            return { pass: false, score: 0, reason: 'commit log not shown' };
          return { pass: true, score: 1, reason: 'ok' };

  - description: "review mode: enters review flow or mentions PRs"
    vars:
      scenario: review-list
    assert:
      - type: javascript
        value: |
          const r = JSON.parse(output);
          if (!/review|PR|MR|pull.request|merge.request|gh pr|glab mr|no.*open|list/i.test(r.output))
            return { pass: false, score: 0, reason: 'no review-related output detected' };
          return { pass: true, score: 1, reason: 'ok' };
